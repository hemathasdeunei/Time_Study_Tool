<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Study Tool</title>
  <link rel="stylesheet" href="css/theme.css" />
  <script src="js/theme-manager.js"></script>
  <style>
    /* ── Window controls only ── */
    .launch-bar {
      -webkit-app-region: drag;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 12px;
      position: absolute;
      top: 0; right: 0; left: 0;
      z-index: 10;
    }
    .fullscreen-btn {
      -webkit-app-region: no-drag;
      width: 32px; height: 32px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted); transition: all var(--t);
      margin-right: 6px;
    }
    .fullscreen-btn:hover { background: var(--bg-overlay); border-color: var(--accent); color: var(--accent); }
    .fullscreen-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .launch-bar .win-controls { -webkit-app-region: no-drag; }

    /* ── Full-screen canvas ── */
    body {
      overflow: hidden;
      background: var(--bg-base);
    }

    .launch-bg {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%,   rgba(99,102,241,.18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 80%,  rgba(16,185,129,.10) 0%, transparent 55%),
        radial-gradient(ellipse 40% 30% at 10% 70%,  rgba(236,72,153,.10) 0%, transparent 55%),
        var(--bg-base);
    }

    /* Animated grid lines */
    .grid-lines {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,.04) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black, transparent);
    }

    /* ── Hero content ── */
    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 0;
    }

    /* Logo mark */
    .logo-mark {
      width: 88px; height: 88px;
      background: linear-gradient(135deg, var(--accent) 0%, #8B5CF6 100%);
      border-radius: 26px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 28px;
      box-shadow: 0 0 40px rgba(99,102,241,.4), 0 20px 40px rgba(0,0,0,.4);
      position: relative;
    }
    .logo-mark::before {
      content: '';
      position: absolute; inset: -1px;
      border-radius: 27px;
      background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
      pointer-events: none;
    }
    .logo-mark svg {
      width: 44px; height: 44px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* App title */
    .app-title {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      text-align: center;
    }
    /* Light theme: dark gradient title */
    :root[data-theme="light"] .app-title {
      background: linear-gradient(135deg, #1A1D2E 20%, #6366F1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .app-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 56px;
      text-align: center;
    }

    /* Clock display */
    .clock-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 56px;
    }
    .clock-time {
      font-size: 52px;
      font-weight: 200;
      letter-spacing: -.02em;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .clock-date {
      font-size: 14px;
      color: var(--text-secondary);
      letter-spacing: .06em;
    }
    .clock-separator {
      animation: blink 1s step-start infinite;
    }
    @keyframes blink { 50% { opacity: .2; } }

    /* Begin button */
    .begin-btn {
      position: relative;
      padding: 18px 52px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      border: none;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--accent) 0%, #8B5CF6 100%);
      color: #fff;
      cursor: pointer;
      transition: all .25s cubic-bezier(.4,0,.2,1);
      box-shadow:
        0 0 30px rgba(99,102,241,.35),
        0 8px 24px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.15);
    }
    .begin-btn::before {
      content: '';
      position: absolute; inset: -2px;
      border-radius: calc(var(--radius-xl) + 2px);
      background: linear-gradient(135deg, rgba(99,102,241,.5), rgba(139,92,246,.5));
      z-index: -1;
      filter: blur(8px);
      opacity: 0;
      transition: opacity .25s;
    }
    .begin-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow:
        0 0 50px rgba(99,102,241,.5),
        0 16px 40px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.2);
    }
    .begin-btn:hover::before { opacity: 1; }
    .begin-btn:active { transform: translateY(0) scale(.99); }

    .begin-btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
    }

    /* Hint text */
    .hint-text {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: .04em;
    }

    /* Version badge */
    .version-badge {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: .06em;
    }

    /* Dots decoration */
    .dots {
      position: fixed;
      bottom: 60px; right: 40px;
      display: grid;
      grid-template-columns: repeat(5, 6px);
      gap: 8px;
      opacity: .15;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
  
    /* ── Settings / Theme gear ── */
    .gear-btn {
      -webkit-app-region: no-drag;
      width: 32px; height: 32px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted); transition: all var(--t);
      margin-right: 6px;
    }
    .gear-btn:hover { background: var(--bg-overlay); border-color: var(--border-hover); color: var(--accent); }
    .gear-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    /* ── Theme picker modal ── */
    .theme-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      display: flex; align-items: flex-start; justify-content: flex-end;
      padding: 64px 20px 0 0; z-index: 800;
    }
    .theme-panel {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; width: 300px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      animation: slideDown .15s ease;
    }
    @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .theme-panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .theme-panel-title  { font-size:13px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.08em; }
    .theme-close {
      width:26px; height:26px; background:var(--bg-overlay); border:1px solid var(--border);
      border-radius:7px; display:flex; align-items:center; justify-content:center;
      cursor:pointer; color:var(--text-muted); font-size:13px; transition:all var(--t);
    }
    .theme-close:hover { background:rgba(239,68,68,.15); color:var(--red); border-color:rgba(239,68,68,.3); }
    .theme-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .theme-card { border:2px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:all .18s ease; }
    .theme-card:hover { border-color:var(--border-hover); transform:translateY(-1px); }
    .theme-card.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .theme-preview { height:52px; display:flex; }
    .theme-preview-base    { flex:2; }
    .theme-preview-surface { flex:2; }
    .theme-preview-accent  { flex:1; }
    .theme-label { padding:7px 10px; font-size:11px; font-weight:600; color:var(--text-secondary); background:var(--bg-overlay); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .theme-card.active .theme-label { color:var(--accent); }
    .settings-section-label { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin:14px 0 8px; }
    .font-size-row { display:flex; gap:8px; }
    .font-btn { flex:1; padding:8px 0; background:var(--bg-overlay); border:1.5px solid var(--border); border-radius:9px; cursor:pointer; color:var(--text-secondary); font-family:inherit; transition:all .15s; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .font-btn:hover { border-color:var(--border-hover); color:var(--text-primary); }
    .font-btn.active { border-color:var(--accent); background:var(--accent-dim); color:var(--accent); }
    .font-btn-letter { font-weight:700; line-height:1; }
    .font-btn-label  { font-size:10px; letter-spacing:.04em; }

    /* ── Lock/slide-in animation ── */
    @keyframes slideInFromTop {
      0%   { transform: translateY(-100vh); opacity: 0; }
      60%  { transform: translateY(8px);   opacity: 1; }
      80%  { transform: translateY(-4px); }
      100% { transform: translateY(0);    opacity: 1; }
    }
    .slide-in {
      animation: slideInFromTop 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body>

  <div class="launch-bg"></div>
  <div class="grid-lines"></div>

  <!-- Window controls -->
  <div class="launch-bar">
            <button class="gear-btn" id="themeBtn" title="Settings">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
    <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle fullscreen">
      <svg id="fsIcon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M21 8V5a2 2 0 00-2-2h-3"/><path d="M3 16v3a2 2 0 002 2h3"/><path d="M16 21h3a2 2 0 002-2v-3"/></svg>
    </button>
    <div class="win-controls">
      <button class="win-btn" id="minBtn" title="Minimize">─</button>
      <button class="win-btn" id="maxBtn" title="Maximize">□</button>
      <button class="win-btn close" id="closeBtn" title="Close">✕</button>
    </div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <!-- Logo -->
    <div class="logo-mark">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <polyline points="12 7 12 12 15.5 14"/>
        <line x1="4.5" y1="4.5" x2="3" y2="3"/>
        <line x1="19.5" y1="4.5" x2="21" y2="3"/>
      </svg>
    </div>

    <!-- Title -->
    <div class="app-title">Time Study Tool</div>
    <div class="app-subtitle">Precision · Performance · Insights</div>

    <!-- Live clock -->
    <div class="clock-display">
      <div class="clock-time" id="clockTime">00<span class="clock-separator">:</span>00<span class="clock-separator">:</span>00</div>
      <div class="clock-date" id="clockDate">—</div>
    </div>

    <!-- Begin button -->
    <button class="begin-btn" id="beginBtn">
      <span class="begin-btn-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </span>
      Begin Time Study
    </button>
    <div class="hint-text">Record your time study session.</div>
  </div>

  <!-- Dots decoration -->
  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>

  <div class="version-badge" id="versionBadge">v1.1.2</div>

  
<!-- ── Theme / Settings Panel ── -->
<div class="theme-overlay" id="themeOverlay" style="display:none">
  <div class="theme-panel" id="themePanel">
    <div class="theme-panel-header">
      <span class="theme-panel-title">Settings</span>
      <div class="theme-close" id="themeClose">✕</div>
    </div>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="settings-section-label">Font Size</div>
    <div class="font-size-row" id="fontSizeRow">
      <button class="font-btn" data-size="small"  onclick="pickFontSize('small')">
        <span class="font-btn-letter" style="font-size:13px">A</span>
        <span class="font-btn-label">Small</span>
      </button>
      <button class="font-btn" data-size="medium" onclick="pickFontSize('medium')">
        <span class="font-btn-letter" style="font-size:16px">A</span>
        <span class="font-btn-label">Medium</span>
      </button>
      <button class="font-btn" data-size="large"  onclick="pickFontSize('large')">
        <span class="font-btn-letter" style="font-size:20px">A</span>
        <span class="font-btn-label">Large</span>
      </button>
    </div>
  </div>
</div>

<script>
    // Window controls
    const fsBtn  = document.getElementById('fullscreenBtn');
  const fsIcon = document.getElementById('fsIcon');
  const FS_EXPAND   = '<path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M21 8V5a2 2 0 00-2-2h-3"/><path d="M3 16v3a2 2 0 002 2h3"/><path d="M16 21h3a2 2 0 002-2v-3"/>';
  const FS_CONTRACT = '<path d="M8 3v5H3"/><path d="M21 8h-5V3"/><path d="M3 16h5v5"/><path d="M16 21v-5h5"/>';
  let isFs = false;
  fsBtn.onclick = () => {
    window.api.toggleFullScreen();
    isFs = !isFs;
    fsIcon.innerHTML = isFs ? FS_CONTRACT : FS_EXPAND;
    fsBtn.title = isFs ? 'Exit fullscreen' : 'Toggle fullscreen';
  };
  document.getElementById('minBtn').onclick   = () => window.api.minimize();
    document.getElementById('maxBtn').onclick   = () => window.api.maximize();
    document.getElementById('closeBtn').onclick = () => window.api.close();

    // Live clock
    const days    = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months  = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function updateClock() {
      const now = new Date();
      const timeParts = now.toLocaleString('en-US', {
        timeZone: 'America/Chicago',
        hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true
      }).match(/^(\d+):(\d+):(\d+)\s+(AM|PM)$/);
      const hh = timeParts ? timeParts[1].padStart(2,'0') : '--';
      const mm = timeParts ? timeParts[2] : '--';
      const ss = timeParts ? timeParts[3] : '--';
      const ampm = timeParts ? timeParts[4] : '';
      document.getElementById('clockTime').innerHTML =
        `${hh}<span class="clock-separator">:</span>${mm}<span class="clock-separator">:</span>${ss} <span style="font-size:0.5em;letter-spacing:.06em">${ampm} CT</span>`;
      const d = new Date(now.toLocaleString('en-US', { timeZone: 'America/Chicago' }));
      document.getElementById('clockDate').textContent =
        `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Begin button
    document.getElementById('beginBtn').addEventListener('click', async () => {
      const btn = document.getElementById('beginBtn');
      btn.disabled = true;
      btn.textContent = 'Starting…';

      const session = await window.api.beginSession();
      // Small delay for feedback
      setTimeout(() => {
        window.api.navigate('projects', { session });
      }, 600);
    });
  
  // ── Settings / Theme panel ─────────────────────────────────────────────────
  function buildThemeGrid() {
    const grid = document.getElementById('themeGrid');
    const current = getTheme();
    grid.innerHTML = Object.entries(THEMES).map(([key, t]) => `
      <div class="theme-card ${key === current ? 'active' : ''}"
           data-key="${key}" onclick="pickTheme('${key}')">
        <div class="theme-preview">
          <div class="theme-preview-base"    style="background:${t.preview[0]}"></div>
          <div class="theme-preview-surface" style="background:${t.preview[1]}"></div>
          <div class="theme-preview-accent"  style="background:${t.preview[2]}"></div>
        </div>
        <div class="theme-label">${t.label}</div>
      </div>`).join('');
    const curSize = getFontSize();
    document.querySelectorAll('.font-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.size === curSize);
    });
  }
  function pickFontSize(key) {
    saveFontSize(key);
    document.querySelectorAll('.font-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.size === key);
    });
  }
  function pickTheme(key) {
    saveTheme(key);
    document.querySelectorAll('.theme-card').forEach(c => {
      c.classList.toggle('active', c.dataset.key === key);
    });
  }
  function openThemePanel() {
    buildThemeGrid();
    document.getElementById('themeOverlay').style.display = 'flex';
  }
  function closeThemePanel() {
    const overlay = document.getElementById('themeOverlay');
    overlay.style.display = 'none';
  }
  document.getElementById('themeBtn').onclick = (e) => {
    e.stopPropagation();
    const ov = document.getElementById('themeOverlay');
    if (ov.style.display === 'none' || !ov.style.display) openThemePanel();
    else closeThemePanel();
  };
  document.getElementById('themeClose').onclick = closeThemePanel;
  document.getElementById('themeOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeThemePanel();
  });


  // Slide-in animation on load
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('.launch-bg').classList.add('slide-in');
    document.querySelector('.grid-lines').classList.add('slide-in');
    document.querySelector('.hero').classList.add('slide-in');
  });

  // Set version dynamically if API provides it
  (async () => {
    try {
      const v = await window.api.getAppVersion();
      if (v) document.getElementById('versionBadge').textContent = 'v' + v;
    } catch {}
  })();
</script>
</body>
</html>
