<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Record Time Study — Time Study Tool</title>
  <link rel="stylesheet" href="css/theme.css"/>
  <script src="js/theme-manager.js"></script>
  <style>
    body { overflow: hidden; }

    /* ── Header ── */
    .app-header {
      -webkit-app-region: drag;
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px; height: 56px;
      background: var(--bg-surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-btn {
      -webkit-app-region: no-drag;
      width: 32px; height: 32px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-secondary); transition: all var(--t);
    }
    .back-btn:hover { background: var(--bg-overlay); border-color: var(--border-hover); color: var(--text-primary); }
    .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .bc-link { color: var(--text-secondary); opacity: 0.85; cursor: pointer; transition: color var(--t), opacity var(--t); }
    .bc-link:hover { color: var(--accent); opacity: 1; }
    .bc-sep { color: var(--text-dim); }
    .bc-cur { color: var(--text-primary); font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hdr-space { flex: 1; }
    /* Fullscreen toggle button */
    .fullscreen-btn {
      -webkit-app-region: no-drag;
      width: 32px; height: 32px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted); transition: all var(--t);
      margin-right: 6px;
    }
    .fullscreen-btn:hover { background: var(--bg-overlay); border-color: var(--accent); color: var(--accent); }
    .fullscreen-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .win-controls { -webkit-app-region: no-drag; display: flex; gap: 4px; }

    /* ── Info bar ── */
    .info-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 20px;
      background: var(--bg-surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0; flex-wrap: wrap;
    }
    .rv-op-name { font-size: 14px; font-weight: 700; color: var(--text-primary); }
    .rv-sep { color: var(--text-dim); font-size: 13px; }
    .rv-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .rv-badge.version { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--accent); }
    .rv-badge.list { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent); }
    .rv-badge.obs { background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-secondary); }
    .rv-badge svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .info-space { flex: 1; }
    .rv-progress { display: flex; align-items: center; gap: 8px; }
    .progress-bar { width: 100px; height: 5px; background: var(--bg-overlay); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s ease; width: 0%; }
    .progress-txt { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    /* ── Status bar ── */
    .status-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 20px;
      background: var(--bg-elevated); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%;
      flex-shrink: 0; transition: background .3s;
    }
    .status-dot.idle     { background: var(--text-dim); }
    .status-dot.ready    { background: #f59e0b; animation: blink 1.2s ease infinite; }
    .status-dot.recording{ background: #ef4444; animation: pulse-r .8s ease infinite; }
    .status-dot.done     { background: #22c55e; }
    .status-text { font-size: 13px; color: var(--text-secondary); }
    .status-text strong  { color: var(--text-primary); font-weight: 700; }
    .status-text .accent { color: var(--accent); font-weight: 700; }
    .kb-hint { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
    .scroll-btns { display: flex; align-items: center; gap: 4px; margin-left: 12px; }
    .scroll-btn {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text-secondary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--t); font-size: 14px; line-height: 1;
      -webkit-app-region: no-drag;
    }
    .scroll-btn:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .scroll-btn:active { transform: scale(.93); }
    .kb-key {
      background: var(--bg-overlay); border: 1px solid var(--border-hover);
      border-radius: 5px; padding: 2px 9px;
      font-size: 11px; font-weight: 700; color: var(--text-secondary);
      box-shadow: 0 1px 0 var(--border);
    }
    @keyframes blink   { 0%,100%{opacity:1} 50%{opacity:.25} }
    @keyframes pulse-r { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.35)} }

    /* Force page to column-flex at full viewport height */
    .page { display: flex !important; flex-direction: column !important; height: 100vh !important; overflow: hidden !important; }

    /* Content area: flex column that holds table + cycle bar + footer */
    .rv-content { display: flex; flex-direction: column; flex: 1; min-height: 0; }

    /* ── Table wrapper ── */
    .rv-wrap { flex: 1; min-height: 0; overflow-x: scroll; overflow-y: auto; position: relative; }

    /* ── Table ── */
    /* Always-visible scrollbar for the table wrap */
    #rvWrap::-webkit-scrollbar { height: 10px; width: 6px; }
    #rvWrap::-webkit-scrollbar-track { background: var(--bg-elevated); border-radius: 4px; }
    #rvWrap::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; opacity: .7; }
    #rvWrap::-webkit-scrollbar-thumb:hover { background: var(--accent-hover); }

    .rv-table {
      border-collapse: separate; border-spacing: 0;
      width: max-content; min-width: 100%;
    }
    .rv-table th, .rv-table td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    /* Header row */
    .rv-table thead th {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg-surface);
      padding: 10px 6px;
      font-size: 11px; font-weight: 700;
      color: var(--text-muted); text-align: center;
      white-space: nowrap;
      transition: background .2s, color .2s;
    }
    .rv-table thead th.th-no   { width: 48px; min-width: 48px; text-align: center; }
    .rv-table thead th.th-step { width: 260px; min-width: 200px; text-align: left; padding-left: 14px; }
    .rv-table thead th.th-obs  { width: 110px; min-width: 90px; }

    /* Sticky left columns */
    .sticky-no   { position: sticky; left: 0; z-index: 5; }
    .sticky-step { position: sticky; left: 48px; z-index: 5; }
    thead .sticky-no, thead .sticky-step { z-index: 15; }

    /* Corner cells: sticky BOTH top AND left */
    .rv-table thead th.sticky-no {
      position: sticky; top: 0; left: 0; z-index: 20;
      background: var(--bg-surface);
    }
    .rv-table thead th.sticky-step {
      position: sticky; top: 0; left: 48px; z-index: 20;
      background: var(--bg-surface);
    }

    /* Step body cells */
    .step-row td { padding: 0; vertical-align: middle; }
    .td-no {
      background: var(--bg-elevated);
      text-align: center; padding: 12px 4px;
      font-size: 11px; font-weight: 700; color: var(--accent);
    }
    .td-step {
      background: var(--bg-surface);
      padding: 11px 14px; min-width: 200px;
      font-size: 13px; color: var(--text-primary); line-height: 1.4;
      border-left: 1px solid var(--border);
    }

    /* Observation cells */
      .obs-cell {
      background: var(--bg-base);
      text-align: right; vertical-align: middle;
      transition: background .15s;
      padding: 0; overflow: hidden;
    }
    .obs-cell .cell-line {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 4px; padding: 8px 8px;
      font-size: 12px; font-variant-numeric: tabular-nums;
    }
    .obs-cell .cont-val {
      font-weight: 700; color: var(--text-primary);
    }
    .obs-cell .cell-sep {
      color: var(--text-dim); font-weight: 400; font-size: 11px;
      display: none;
    }
    .obs-cell .elem-val {
      font-weight: 600; color: #ef4444;
    }

    /* Active obs column highlight */
    .obs-hdr-active { color: var(--accent) !important; background: var(--accent-dim) !important; }
    .obs-col-active { background: rgba(99,102,241,.05) !important; }

    /* Current cell being timed */
    .cell-recording {
      background: var(--accent-dim) !important;
      outline: 2px solid var(--accent); outline-offset: -2px;
    }
    .cell-recording .cont-val { color: var(--accent) !important; animation: blink .6s ease infinite; }
    .cell-recording .cell-sep  { color: var(--accent) !important; opacity: .7; }
    .cell-recording .elem-val  { color: var(--accent) !important; opacity: .7; }

    /* ── Cycle bar (always-visible row below table) ── */
    /* ── Cycle (Time for 1 Cycle) tfoot row ── */
    #rvTfoot tr { border-top: 2px solid var(--border-hover); }
    #rvTfoot td { background: var(--bg-elevated); padding: 0; }
    .cycle-td-no {
      width: 48px; min-width: 48px;
      padding: 10px 4px;
      font-size: 11px; color: var(--text-dim); text-align: center;
      position: sticky; left: 0; z-index: 5; background: var(--bg-elevated);
    }
    .cycle-td-lbl {
      width: 260px; min-width: 200px;
      padding: 10px 14px;
      font-size: 12px; font-weight: 700; color: var(--text-secondary);
      position: sticky; left: 48px; z-index: 5; background: var(--bg-elevated);
    }
    .cycle-val {
      width: 110px; min-width: 90px;
      padding: 10px 8px;
      font-size: 12px; font-weight: 800; color: var(--accent);
      text-align: center; font-variant-numeric: tabular-nums;
    }

    /* ── Footer ── */
    .rv-footer {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; height: 56px;
      background: var(--bg-surface); border-top: 1px solid var(--border);
      position: relative; z-index: 30;
    }
    .obs-progress-lbl { font-size: 12px; color: var(--text-muted); margin-right: auto; }
  
    /* ── Settings / Theme gear ── */
    .gear-btn {
      -webkit-app-region: no-drag;
      width: 32px; height: 32px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted); transition: all var(--t);
      margin-right: 6px;
    }
    .gear-btn:hover { background: var(--bg-overlay); border-color: var(--border-hover); color: var(--accent); }
    .gear-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    /* ── Theme picker modal ── */
    .theme-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      display: flex; align-items: flex-start; justify-content: flex-end;
      padding: 64px 20px 0 0; z-index: 800;
    }
    .theme-panel {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; width: 300px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      animation: slideDown .15s ease;
    }
    @keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .theme-panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .theme-panel-title  { font-size:13px; font-weight:700; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.08em; }
    .theme-close {
      width:26px; height:26px; background:var(--bg-overlay); border:1px solid var(--border);
      border-radius:7px; display:flex; align-items:center; justify-content:center;
      cursor:pointer; color:var(--text-muted); font-size:13px; transition:all var(--t);
    }
    .theme-close:hover { background:rgba(239,68,68,.15); color:var(--red); border-color:rgba(239,68,68,.3); }
    .theme-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .theme-card { border:2px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:all .18s ease; }
    .theme-card:hover { border-color:var(--border-hover); transform:translateY(-1px); }
    .theme-card.active { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .theme-preview { height:52px; display:flex; }
    .theme-preview-base    { flex:2; }
    .theme-preview-surface { flex:2; }
    .theme-preview-accent  { flex:1; }
    .theme-label { padding:7px 10px; font-size:11px; font-weight:600; color:var(--text-secondary); background:var(--bg-overlay); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .theme-card.active .theme-label { color:var(--accent); }
    .settings-section-label { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin:14px 0 8px; }
    .font-size-row { display:flex; gap:8px; }
    .font-btn { flex:1; padding:8px 0; background:var(--bg-overlay); border:1.5px solid var(--border); border-radius:9px; cursor:pointer; color:var(--text-secondary); font-family:inherit; transition:all .15s; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .font-btn:hover { border-color:var(--border-hover); color:var(--text-primary); }
    .font-btn.active { border-color:var(--accent); background:var(--accent-dim); color:var(--accent); }
    .font-btn-letter { font-weight:700; line-height:1; }
    .font-btn-label  { font-size:10px; letter-spacing:.04em; }
    .lock-btn {
      -webkit-app-region: no-drag;
      width: 32px; height: 32px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 9px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted); transition: all var(--t);
    }
    .lock-btn:hover { background: var(--bg-overlay); border-color: var(--accent); color: var(--accent); }
    .lock-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  
    .about-link {
      -webkit-app-region: no-drag;
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 6px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-secondary); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.18s; letter-spacing: 0.02em;
    }
    .about-link:hover { background: var(--bg-overlay); border-color: var(--accent); color: var(--accent); }
    .about-link svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  </style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header class="app-header">
    <button class="back-btn" id="backBtn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="breadcrumb">
      <span class="bc-link" id="bcOp">Operation</span>
      <span class="bc-sep">›</span>
      <span class="bc-cur" id="pageTitle">Record Time Study</span>
    </div>
    <div class="hdr-space"></div>
    <button class="btn btn-primary" id="openEditorBtn" style="-webkit-app-region:no-drag;font-size:12px;padding:6px 14px;display:none;align-items:center;gap:6px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Open in Editor
    </button>
    <button class="btn btn-ghost" id="exportBtn" style="-webkit-app-region:no-drag;font-size:12px;padding:6px 14px;display:none;align-items:center;gap:6px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export Excel
    </button>
    <button class="btn btn-ghost" id="saveBtnTop" style="-webkit-app-region:no-drag;font-size:12px;padding:6px 14px;display:flex;align-items:center;gap:6px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <button class="btn btn-primary" id="completeBtnTop" style="-webkit-app-region:no-drag;font-size:12px;padding:6px 14px;display:flex;align-items:center;gap:6px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      Complete Time Study
    </button>
            <!-- About link -->
    <button class="about-link" id="aboutBtn" title="About Time Study Tool">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      About
    </button>
    <button class="gear-btn" id="themeBtn" title="Settings">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
    <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle fullscreen">
      <svg id="fsIcon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M21 8V5a2 2 0 00-2-2h-3"/><path d="M3 16v3a2 2 0 002 2h3"/><path d="M16 21h3a2 2 0 002-2v-3"/></svg>
    </button>
    <div class="win-controls">
          <button class="lock-btn" id="lockBtn" title="Lock screen">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </button>
      <button class="win-btn" id="minBtn">─</button>
      <button class="win-btn" id="maxBtn">□</button>
      <button class="win-btn close" id="closeBtn">✕</button>
    </div>
  </header>

  <!-- Info bar -->
  <div class="info-bar">
    <span class="rv-op-name" id="opNameDisplay">—</span>
    <span class="rv-sep">·</span>
    <span class="rv-badge version" id="versionBadge">v—</span>
    <span class="rv-badge list" id="listBadge">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span id="listNameDisplay">—</span>
    </span>
    <span class="rv-badge obs">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="obsTotalDisplay">—</span> observations
    </span>
    <div class="info-space"></div>
    <div class="rv-progress">
      <span class="progress-txt" id="progTxt">0 / 0</span>
      <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    </div>
  </div>

  <!-- Read-only banner (hidden by default) -->
  <div id="readOnlyBanner" style="display:none;align-items:center;gap:10px;padding:9px 20px;background:rgba(34,197,94,.08);border-bottom:1px solid rgba(34,197,94,.25);flex-shrink:0">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <span style="font-size:13px;color:#22c55e;font-weight:600">View Only — this recording has already been saved</span>
  </div>

  <!-- Status bar -->
  <div class="status-bar" id="statusBar">
    <div class="status-dot idle" id="statusDot"></div>
    <span class="status-text" id="statusText">Press <strong>SPACEBAR</strong> to begin <span class="accent">Observation 1</span></span>
    <div class="kb-hint">
      <span class="kb-key">Space</span>
      <span>to record each step</span>
    </div>
    <div class="scroll-btns">
      <button class="scroll-btn" id="scrollLeft" title="Scroll left">&#8592;</button>
      <button class="scroll-btn" id="scrollRight" title="Scroll right">&#8594;</button>
    </div>
  </div>

  <!-- Table + cycle bar + footer in a constrained flex column -->
  <div class="rv-content">
    <div class="rv-wrap" id="rvWrap">
      <table class="rv-table" id="rvTable">
        <thead id="rvThead"></thead>
        <tbody id="rvTbody"></tbody>
        <tfoot id="rvTfoot"></tfoot>
      </table>
    </div>

    <!-- Footer -->
    <div class="rv-footer">
    <span class="obs-progress-lbl" id="footerProg"></span>
    <button class="btn btn-ghost" id="cancelBtn">Back</button>
    <button class="btn btn-ghost" id="saveBtn" style="margin-right:8px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <button class="btn btn-primary" id="completeBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      Complete Time Study
    </button>
  </div>
  </div><!-- /.rv-content -->

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>


<!-- ── Theme / Settings Panel ── -->
<div class="theme-overlay" id="themeOverlay" style="display:none">
  <div class="theme-panel" id="themePanel">
    <div class="theme-panel-header">
      <span class="theme-panel-title">Settings</span>
      <div class="theme-close" id="themeClose">✕</div>
    </div>
    <div class="theme-grid" id="themeGrid"></div>
    <div class="settings-section-label">Font Size</div>
    <div class="font-size-row" id="fontSizeRow">
      <button class="font-btn" data-size="small"  onclick="pickFontSize('small')">
        <span class="font-btn-letter" style="font-size:13px">A</span>
        <span class="font-btn-label">Small</span>
      </button>
      <button class="font-btn" data-size="medium" onclick="pickFontSize('medium')">
        <span class="font-btn-letter" style="font-size:16px">A</span>
        <span class="font-btn-label">Medium</span>
      </button>
      <button class="font-btn" data-size="large"  onclick="pickFontSize('large')">
        <span class="font-btn-letter" style="font-size:20px">A</span>
        <span class="font-btn-label">Large</span>
      </button>
    </div>
  </div>
</div>

<script>
// ── Navigation params ─────────────────────────────────────────────────────────
let navParams = null;
let stepList  = null;
let steps     = [];      // array of {id, step_text, order_index}
let totalObs  = 0;
let totalSteps = 0;

// ── State machine ─────────────────────────────────────────────────────────────
const S = { IDLE: 'idle', OBS_READY: 'obs_ready', RECORDING: 'recording', DONE: 'done' };
let state       = S.IDLE;
let currentObs  = 1;
let currentStep = 1;
let obsStartMs  = null;
let prevMs      = null;
let data        = {};   // data[obs][step] = { continuous_ms, elemental_ms }
let liveTimer   = null;
let completedObs = 0;

// ── Window controls ─────────────────────────────────────────────────────────
document.getElementById('minBtn').onclick   = () => window.api.minimize();

// Fullscreen toggle
const fsBtn  = document.getElementById('fullscreenBtn');
const fsIcon = document.getElementById('fsIcon');
const FS_EXPAND   = '<path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M21 8V5a2 2 0 00-2-2h-3"/><path d="M3 16v3a2 2 0 002 2h3"/><path d="M16 21h3a2 2 0 002-2v-3"/>';
const FS_CONTRACT = '<path d="M8 3v5H3"/><path d="M21 8h-5V3"/><path d="M3 16h5v5"/><path d="M16 21v-5h5"/>';
let isFs = false;
fsBtn.onclick = () => {
  window.api.toggleFullScreen();
  isFs = !isFs;
  fsIcon.innerHTML = isFs ? FS_CONTRACT : FS_EXPAND;
  fsBtn.title = isFs ? 'Exit fullscreen' : 'Toggle fullscreen';
};
document.getElementById('maxBtn').onclick   = () => window.api.maximize();
document.getElementById('closeBtn').onclick = () => window.api.close();
    document.getElementById('lockBtn').onclick = () => window.api.navigate('launch');
  document.getElementById('aboutBtn').onclick = () => window.api.navigate('about');

// ── Navigation ────────────────────────────────────────────────────────────────
document.getElementById('backBtn').onclick  = goBack;
document.getElementById('cancelBtn').onclick = goBack;
document.getElementById('bcOp').onclick     = goBack;

function getCompletedCells() {
  // Only include observations where ALL steps are recorded
  const cells = [];
  for (let o = 1; o <= totalObs; o++) {
    const obsData = data[o];
    if (!obsData) continue;
    const allStepsDone = Array.from({length: totalSteps}, (_, i) => i + 1).every(s => obsData[s]);
    if (!allStepsDone) continue; // skip partial observations
    for (let s = 1; s <= totalSteps; s++) {
      cells.push({ step_order: s, obs_num: o, continuous_ms: obsData[s].continuous_ms, elemental_ms: obsData[s].elemental_ms });
    }
  }
  return cells;
}

async function goBack() {
  stopLiveTimer();
  // Auto-save completed observations silently (no popup)
  const cells = getCompletedCells();
  if (cells.length > 0 && navParams && navParams.tsId) {
    try {
      await window.api.saveRecording(navParams.tsId, cells, false);
    } catch (e) { /* silent */ }
  }
  if (navParams && navParams.project && navParams.operation) {
    window.api.navigate('operation-detail', {
      project: navParams.project,
      operation: navParams.operation,
    });
  } else {
    window.api.navigate('projects');
  }
}

window.api.onNavigate(async (d) => {
  if (!d) return;
  navParams = d;
  window.api.ensureMaximized();
  totalObs = d.observations || 10;

  // Load step list
  stepList = await window.api.getStepList(d.listId);
  if (!stepList) { showToast('Step list not found', 'error'); return; }

  steps = stepList.items || [];
  totalSteps = steps.length;

  // Populate info bar
  document.getElementById('opNameDisplay').textContent    = d.opName || '—';
  document.getElementById('versionBadge').textContent     = 'v' + (d.version || '—');
  document.getElementById('listNameDisplay').textContent  = stepList.name;
  document.getElementById('obsTotalDisplay').textContent  = totalObs;
  document.getElementById('bcOp').textContent             = d.opName || 'Operation';

  buildTable();

  if (d.isReadOnly) {
    // ── Read-only: load and display recorded data ──
    document.getElementById('pageTitle').textContent    = 'View Time Study';
    document.getElementById('completeBtnTop').style.display = 'none';
    document.getElementById('saveBtnTop').style.display     = 'none';
    document.getElementById('exportBtn').style.display = 'flex';
    // document.getElementById('openEditorBtn').style.display = 'flex'; // hidden for now
    document.getElementById('completeBtn').style.display    = 'none';
    document.getElementById('saveBtn').style.display        = 'none';
    document.getElementById('readOnlyBanner').style.display = 'flex';
    document.getElementById('statusBar').style.display      = 'none';

    const cells = await window.api.getRecording(d.tsId);
    cells.forEach(c => {
      renderCell(c.obs_num, c.step_order, c.continuous_ms, c.elemental_ms);
    });
    // Rebuild cycle rows
    for (let o = 1; o <= totalObs; o++) updateCycleRowFromCells(cells, o);

    // Update progress to show complete
    completedObs = new Set(cells.map(c => c.obs_num)).size;
    updateProgress();
  } else if (d.continueRecording) {
    // ── Continue: load existing partial data, then allow recording ──
    document.getElementById('pageTitle').textContent = 'Continue Time Study';
    const cells = await window.api.getRecording(d.tsId);
    cells.forEach(cell => {
      renderCell(cell.obs_num, cell.step_order, cell.continuous_ms, cell.elemental_ms);
      // Restore data object so recording can continue
      if (!data[cell.obs_num]) data[cell.obs_num] = {};
      data[cell.obs_num][cell.step_order] = { continuous_ms: cell.continuous_ms, elemental_ms: cell.elemental_ms };
    });
    for (let o = 1; o <= totalObs; o++) updateCycleRowFromCells(cells, o);
    completedObs = new Set(cells.map(cell => cell.obs_num)).size;
    // Jump to the next empty (not fully completed) observation
    let nextEmpty = totalObs; // default to last
    for (let o = 1; o <= totalObs; o++) {
      const obsData = data[o];
      const allDone = obsData && Array.from({length: totalSteps}, (_, i) => i + 1).every(s => obsData[s]);
      if (!allDone) { nextEmpty = o; break; }
    }
    currentObs = nextEmpty;
    currentStep = 1;
    setTimeout(() => scrollToObs(currentObs), 200);
    updateStatus();
    updateProgress();
  } else {
    updateStatus();
    updateProgress();
  }
});

// ── Table builder ─────────────────────────────────────────────────────────────
function buildTable() {
  // ── thead ──
  const thead = document.getElementById('rvThead');
  const hdrRow = document.createElement('tr');

  const thNo = document.createElement('th');
  thNo.className = 'th-no sticky-no';
  thNo.textContent = 'No';

  const thStep = document.createElement('th');
  thStep.className = 'th-step sticky-step';
  thStep.textContent = 'Steps';

  hdrRow.appendChild(thNo);
  hdrRow.appendChild(thStep);

  for (let o = 1; o <= totalObs; o++) {
    const th = document.createElement('th');
    th.className = 'th-obs';
    th.id = `obs-hdr-${o}`;
    th.textContent = o;
    hdrRow.appendChild(th);
  }
  thead.innerHTML = '';
  thead.appendChild(hdrRow);

  // ── tbody ──
  const tbody = document.getElementById('rvTbody');
  tbody.innerHTML = '';

  steps.forEach((step, idx) => {
    const stepNum = idx + 1;
    const tr = document.createElement('tr');
    tr.className = 'step-row';
    tr.id = `step-row-${stepNum}`;

    const tdNo = document.createElement('td');
    tdNo.className = 'td-no sticky-no';
    tdNo.textContent = stepNum;

    const tdStep = document.createElement('td');
    tdStep.className = 'td-step sticky-step';
    tdStep.textContent = step.step_text;

    tr.appendChild(tdNo);
    tr.appendChild(tdStep);

    for (let o = 1; o <= totalObs; o++) {
      const td = document.createElement('td');
      td.className = 'obs-cell';
      td.id = `cell-${o}-${stepNum}`;
      td.dataset.obs = o;
      td.dataset.step = stepNum;

      const lineDiv = document.createElement('div');
      lineDiv.className = 'cell-line';

      const contDiv = document.createElement('span');
      contDiv.className = 'cont-val';
      contDiv.id = `cont-${o}-${stepNum}`;
      contDiv.textContent = '';

      const sepSpan = document.createElement('span');
      sepSpan.className = 'cell-sep';
      sepSpan.textContent = '|';

      const elemDiv = document.createElement('span');
      elemDiv.className = 'elem-val';
      elemDiv.id = `elem-${o}-${stepNum}`;
      elemDiv.textContent = '';

      lineDiv.appendChild(contDiv);
      lineDiv.appendChild(sepSpan);
      lineDiv.appendChild(elemDiv);
      td.appendChild(lineDiv);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });

  // ── cycle (time for 1 cycle) tfoot row ──
  const tfoot = document.getElementById('rvTfoot');
  tfoot.innerHTML = '';
  const cycleRow = document.createElement('tr');

  const tdNo = document.createElement('td');
  tdNo.className = 'cycle-td-no';
  tdNo.textContent = '—';
  cycleRow.appendChild(tdNo);

  const tdLbl = document.createElement('td');
  tdLbl.className = 'cycle-td-lbl';
  tdLbl.textContent = 'Time for 1 Cycle';
  cycleRow.appendChild(tdLbl);

  for (let o = 1; o <= totalObs; o++) {
    const td = document.createElement('td');
    td.className = 'cycle-val';
    td.id = `cycle-${o}`;
    td.textContent = '';
    cycleRow.appendChild(td);
  }
  tfoot.appendChild(cycleRow);
}

// ── Scroll buttons ────────────────────────────────────────────────────────────
document.getElementById('scrollLeft').addEventListener('click', () => {
  const wrap = document.getElementById('rvWrap');
  wrap.scrollBy({ left: -300, behavior: 'smooth' });
});
document.getElementById('scrollRight').addEventListener('click', () => {
  const wrap = document.getElementById('rvWrap');
  wrap.scrollBy({ left: 300, behavior: 'smooth' });
});

// Cycle bar scrolls naturally with table content inside rv-wrap

// ── Spacebar handler ──────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat) {
    if (navParams && navParams.isReadOnly) return;
    e.preventDefault();
    handleSpace();
  }
});

function handleSpace() {
  if (state === S.DONE) return;

  if (state === S.IDLE || state === S.OBS_READY) {
    // Start recording current observation, step 1
    const now = Date.now();
    obsStartMs  = now;
    prevMs      = now;
    currentStep = 1;
    state = S.RECORDING;
    startLiveTimer();
    updateHighlight();
    updateStatus();
    return;
  }

  if (state === S.RECORDING) {
    const now = Date.now();
    const contMs = now - obsStartMs;
    const elemMs = now - prevMs;
    prevMs = now;

    // Store
    if (!data[currentObs]) data[currentObs] = {};
    data[currentObs][currentStep] = { continuous_ms: contMs, elemental_ms: elemMs };

    // Render the recorded cell
    stopLiveTimer();
    renderCell(currentObs, currentStep, contMs, elemMs);
    updateCycleRow(currentObs);

    if (currentStep < totalSteps) {
      // Move to next step
      currentStep++;
      startLiveTimer();
      updateHighlight();
      updateStatus();
    } else {
      // This observation is done
      completedObs++;
      updateProgress();

      if (currentObs < totalObs) {
        currentObs++;
        currentStep = 1;
        state = S.OBS_READY;
        updateHighlight();
        updateStatus();
        setTimeout(() => scrollToObs(currentObs), 80);
      } else {
        // ALL DONE
        state = S.DONE;
        updateHighlight();
        updateStatus();
        document.getElementById('completeBtn').focus();
      }
    }
  }
}

// ── Live timer ────────────────────────────────────────────────────────────────
function startLiveTimer() {
  stopLiveTimer();
  liveTimer = setInterval(() => {
    if (state !== S.RECORDING) { stopLiveTimer(); return; }
    const now    = Date.now();
    const contMs = now - obsStartMs;
    const elemMs = now - prevMs;
    const contEl = document.getElementById(`cont-${currentObs}-${currentStep}`);
    const elemEl = document.getElementById(`elem-${currentObs}-${currentStep}`);
    if (contEl) contEl.textContent = fmtSec(contMs);
    if (elemEl) elemEl.textContent = fmtSec(elemMs);
  }, 80);
}

function stopLiveTimer() {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
}

// ── Cell rendering ────────────────────────────────────────────────────────────
function renderCell(obs, step, contMs, elemMs) {
  const contEl = document.getElementById(`cont-${obs}-${step}`);
  const elemEl = document.getElementById(`elem-${obs}-${step}`);
  if (contEl) contEl.textContent = fmtSec(contMs);
  if (elemEl) elemEl.textContent = fmtSec(elemMs);
  // Show separator only when cell has data
  const cell = document.getElementById(`cell-${obs}-${step}`);
  if (cell) {
    cell.classList.remove('cell-recording');
    const sep = cell.querySelector('.cell-sep');
    if (sep) sep.style.display = (contMs > 0 || elemMs > 0) ? 'inline' : 'none';
  }
}

function updateCycleRowFromCells(cells, obs) {
  let total = 0;
  cells.filter(c => c.obs_num === obs).forEach(c => { total += c.elemental_ms; });
  const el = document.getElementById(`cycle-${obs}`);
  if (el) el.textContent = total > 0 ? fmtSec(total) : '';
}

function updateCycleRow(obs) {
  let total = 0;
  for (let s = 1; s <= totalSteps; s++) {
    if (data[obs] && data[obs][s]) total += data[obs][s].elemental_ms;
  }
  const el = document.getElementById(`cycle-${obs}`);
  if (el) el.textContent = total > 0 ? fmtSec(total) : '';
}

// ── Highlight management ──────────────────────────────────────────────────────
function updateHighlight() {
  // Clear all
  document.querySelectorAll('.obs-hdr-active').forEach(el => el.classList.remove('obs-hdr-active'));
  document.querySelectorAll('.obs-col-active').forEach(el => el.classList.remove('obs-col-active'));
  document.querySelectorAll('.cell-recording').forEach(el => el.classList.remove('cell-recording'));

  if (state === S.IDLE || state === S.DONE) return;

  // Highlight current obs column header
  const hdr = document.getElementById(`obs-hdr-${currentObs}`);
  if (hdr) hdr.classList.add('obs-hdr-active');

  // Highlight all cells in current obs column
  document.querySelectorAll(`[data-obs="${currentObs}"]`).forEach(el => {
    el.classList.add('obs-col-active');
  });

  if (state === S.RECORDING) {
    // Highlight exact current cell
    const cell = document.getElementById(`cell-${currentObs}-${currentStep}`);
    if (cell) {
      cell.classList.remove('obs-col-active');
      cell.classList.add('cell-recording');
    }
    // Scroll to make the cell visible
    scrollToCell(currentObs, currentStep);
  }
}

function scrollToObs(obs) {
  const wrap = document.getElementById('rvWrap');
  const hdr  = document.getElementById(`obs-hdr-${obs}`);
  if (!wrap || !hdr) return;
  const stickyW   = 48 + 260;           // no-col + step-col
  const hdrLeft   = hdr.offsetLeft;
  const hdrRight  = hdrLeft + hdr.offsetWidth;
  const viewLeft  = wrap.scrollLeft + stickyW;
  const viewRight = wrap.scrollLeft + wrap.clientWidth;
  if (hdrLeft < viewLeft) {
    wrap.scrollTo({ left: hdrLeft - stickyW - 8, behavior: 'smooth' });
  } else if (hdrRight > viewRight) {
    wrap.scrollTo({ left: hdrRight - wrap.clientWidth + 8, behavior: 'smooth' });
  }
}

function scrollToCell(obs, step) {
  scrollToObs(obs);
}

// ── Status bar ────────────────────────────────────────────────────────────────
function updateStatus() {
  const dot  = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  dot.className = 'status-dot ' + state;

  if (state === S.IDLE) {
    text.innerHTML = `Press <strong>SPACEBAR</strong> to begin <span class="accent">Observation 1</span>`;
  } else if (state === S.OBS_READY) {
    text.innerHTML = `<span class="accent">Observation ${currentObs}</span> ready — press <strong>SPACEBAR</strong> to start Step 1`;
  } else if (state === S.RECORDING) {
    text.innerHTML = `Recording <span class="accent">Obs ${currentObs}</span> · <strong>Step ${currentStep}</strong> of ${totalSteps} — press <strong>SPACEBAR</strong> when step is done`;
  } else if (state === S.DONE) {
    text.innerHTML = `<span style="color:#22c55e;font-weight:700">✓ All ${totalObs} observations complete</span> — click <strong>Complete Time Study</strong> to save`;
  }
}

// ── Progress ──────────────────────────────────────────────────────────────────
function updateProgress() {
  const pct = totalObs > 0 ? (completedObs / totalObs) * 100 : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progTxt').textContent = `${completedObs} / ${totalObs}`;
  document.getElementById('footerProg').textContent = `${completedObs} of ${totalObs} observations recorded`;
}

// ── Complete ──────────────────────────────────────────────────────────────────
async function doComplete() {
  const recorded = Object.keys(data).length;
  if (recorded === 0) { showToast('No observations recorded yet', 'error'); return; }
  if (state === S.RECORDING) {
    stopLiveTimer(); // stop timer, no popup
  }
  const cells = getCompletedCells(); // only fully completed observations
  if (cells.length === 0) { showToast('No completed observations to save', 'error'); return; }
  ['completeBtn','completeBtnTop'].forEach(id => {
    const b = document.getElementById(id);
    if (b) { b.disabled = true; b.textContent = 'Saving…'; }
  });

  try {
    await window.api.saveRecording(navParams.tsId, cells, false); // save data
    await window.api.completeTimestamp(navParams.tsId);               // explicitly mark complete
    showToast('Time study completed successfully', 'success');
    window.api.navigate('operation-detail', {
      project: navParams.project,
      operation: navParams.operation,
    });
  } catch (err) {
    showToast('Error saving recording', 'error');
    ['completeBtn','completeBtnTop'].forEach(id => {
      const b = document.getElementById(id);
      if (b) { b.disabled = false; b.textContent = 'Complete Time Study'; }
    });
  }
}
async function doSave() {
  const cells = getCompletedCells(); // only fully completed observations
  if (cells.length === 0) { showToast('No completed observations to save yet', 'error'); return; }
  ['saveBtn','saveBtnTop'].forEach(id => {
    const b = document.getElementById(id); if (b) { b.disabled = true; b.textContent = 'Saving…'; }
  });
  try {
    await window.api.saveRecording(navParams.tsId, cells, false); // partial save, not complete
    showToast('Progress saved — you can continue recording', 'success');
  } catch (err) {
    showToast('Error saving', 'error');
  } finally {
    ['saveBtn','saveBtnTop'].forEach(id => {
      const b = document.getElementById(id);
      if (b) { b.disabled = false; b.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save'; }
    });
  }
}
document.getElementById('completeBtn').addEventListener('click', doComplete);
document.getElementById('completeBtnTop').addEventListener('click', doComplete);
document.getElementById('saveBtn').addEventListener('click', doSave);
document.getElementById('saveBtnTop').addEventListener('click', doSave);

// ── Export ───────────────────────────────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportBtn');
  btn.disabled = true;
  btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Exporting…';

  const cells = await window.api.getRecording(navParams.tsId);
  const result = await window.api.exportTimestudy({
    steps,
    cells,
    totalObs,
    tsId:      navParams.tsId,
    opName:    navParams.opName,
    version:   navParams.version,
    listName:  stepList ? stepList.name : '',
    project:   navParams.project   || null,
    operation: navParams.operation || null,
  });

  btn.disabled = false;
  btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export Excel';

  if (result && result.success) showToast('Exported to ' + result.filePath.split(/[\\/]/).pop(), 'success');
  else if (!result || !result.cancelled) showToast('Export failed', 'error');
});

// ── Open in Editor ────────────────────────────────────────────────────────────
document.getElementById('openEditorBtn').addEventListener('click', () => {
  if (!navParams) return;
  window.api.navigate('editor', {
    tsId: navParams.tsId, version: navParams.version, listId: navParams.listId,
    observations: navParams.observations, opId: navParams.opId,
    opName: navParams.opName, project: navParams.project, operation: navParams.operation,
  });
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtSec(ms) {
  const s = ms / 1000;
  if (s < 60) return s.toFixed(2) + 's';
  const m = Math.floor(s / 60);
  const rem = (s % 60).toFixed(2).padStart(5, '0');
  return m + ':' + rem + 's';
}

function escHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

  // ── Settings / Theme panel ─────────────────────────────────────────────────
  function buildThemeGrid() {
    const grid = document.getElementById('themeGrid');
    const current = getTheme();
    grid.innerHTML = Object.entries(THEMES).map(([key, t]) => `
      <div class="theme-card ${key === current ? 'active' : ''}"
           data-key="${key}" onclick="pickTheme('${key}')">
        <div class="theme-preview">
          <div class="theme-preview-base"    style="background:${t.preview[0]}"></div>
          <div class="theme-preview-surface" style="background:${t.preview[1]}"></div>
          <div class="theme-preview-accent"  style="background:${t.preview[2]}"></div>
        </div>
        <div class="theme-label">${t.label}</div>
      </div>`).join('');
    const curSize = getFontSize();
    document.querySelectorAll('.font-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.size === curSize);
    });
  }
  function pickFontSize(key) {
    saveFontSize(key);
    document.querySelectorAll('.font-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.size === key);
    });
  }
  function pickTheme(key) {
    saveTheme(key);
    document.querySelectorAll('.theme-card').forEach(c => {
      c.classList.toggle('active', c.dataset.key === key);
    });
  }
  function openThemePanel() {
    buildThemeGrid();
    document.getElementById('themeOverlay').style.display = 'flex';
  }
  function closeThemePanel() {
    const overlay = document.getElementById('themeOverlay');
    overlay.style.display = 'none';
  }
  document.getElementById('themeBtn').onclick = (e) => {
    e.stopPropagation();
    const ov = document.getElementById('themeOverlay');
    if (ov.style.display === 'none' || !ov.style.display) openThemePanel();
    else closeThemePanel();
  };
  document.getElementById('themeClose').onclick = closeThemePanel;
  document.getElementById('themeOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeThemePanel();
  });

</script>
